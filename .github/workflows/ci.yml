name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install test deps
        run: pip install pytest websocket-client

      - name: unit tests
        run: python -m pytest -q tests

      - name: compose file is valid
        run: |
          cp .env.example .env
          docker compose config > /dev/null

      - name: image builds
        run: docker build -q -t clockwork:ci .
